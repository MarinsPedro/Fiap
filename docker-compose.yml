services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fiap_cloud_games
      POSTGRES_USER: fiap_cloud_games
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fiap_cloud_games_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiap_cloud_games -d fiap_cloud_games"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: src/Database/FiapCloudGames.Database.Migrations/Dockerfile
    environment:
      ConnectionStrings__Database: Host=database;Port=5432;Database=fiap_cloud_games;Username=fiap_cloud_games;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      Admin__Name: ${ADMIN_NAME:-Administrador}
      Admin__Email: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Api/FiapCloudGames.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=database;Port=5432;Database=fiap_cloud_games;Username=fiap_cloud_games;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY com ao menos 32 caracteres}
      Jwt__Issuer: FiapCloudGames
      Jwt__Audience: FiapCloudGames.Client
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  fiap_cloud_games_data:
